[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "transporte-urbs-api"
version = "0.1.0"
description = "API somente-leitura para dados da URBS (Curitiba)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
    "pydantic>=2.9",
]

[tool.setuptools.packages.find]
where = ["src"]
